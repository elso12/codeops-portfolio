<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#4A180B"/>
      <stop offset="100%" stop-color="#1F0803"/>
    </radialGradient>
    <linearGradient id="stewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A83216"/>
      <stop offset="50%" stop-color="#8F2D14"/>
      <stop offset="100%" stop-color="#5E1A0A"/>
    </linearGradient>
    <linearGradient id="injeraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C4B1"/>
      <stop offset="50%" stop-color="#EBE0D3"/>
      <stop offset="100%" stop-color="#C5B19D"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A83B"/>
      <stop offset="100%" stop-color="#A66B12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Pattern motif background -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="#D99426" stroke-width="2" stroke-dasharray="12 8" opacity="0.2"/>

  <!-- Platter Plate / Mesob Rim -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="300" r="220" fill="#2D2523" stroke="url(#goldRim)" stroke-width="8"/>
    <!-- Teff Injera Base -->
    <circle cx="400" cy="300" r="204" fill="url(#injeraGrad)"/>
    <!-- Injera texture dots -->
    <circle cx="340" cy="240" r="3" fill="#A89480" opacity="0.5"/>
    <circle cx="440" cy="220" r="4" fill="#A89480" opacity="0.4"/>
    <circle cx="480" cy="340" r="3" fill="#A89480" opacity="0.5"/>
    <circle cx="310" cy="360" r="4" fill="#A89480" opacity="0.4"/>
    
    <!-- Deep Clay Stew Bowl -->
    <circle cx="400" cy="300" r="140" fill="url(#stewGrad)" stroke="#521B0F" stroke-width="6"/>
    <circle cx="400" cy="300" r="128" fill="url(#stewGrad)"/>

    <!-- Caramellized Onion & Oil Swirls -->
    <path d="M 320 280 Q 360 250 420 270 T 460 330" fill="none" stroke="#D99426" stroke-width="4" opacity="0.7"/>
    <path d="M 340 330 Q 390 370 440 320" fill="none" stroke="#E5A83B" stroke-width="3" opacity="0.6"/>

    <!-- Chicken Leg Piece -->
    <path d="M 370 260 C 340 230 360 200 390 210 C 420 220 440 250 420 280 C 400 300 380 280 370 260 Z" fill="#7D240E" stroke="#521204" stroke-width="3"/>
    <ellipse cx="380" cy="225" rx="14" ry="10" fill="#E5A83B" opacity="0.8"/>

    <!-- Hard Boiled Egg (Halved) -->
    <ellipse cx="440" cy="270" rx="22" ry="18" fill="#FFFFFF"/>
    <ellipse cx="440" cy="270" rx="12" ry="10" fill="#F4B41A"/>
    
    <!-- Egg 2 -->
    <ellipse cx="360" cy="330" rx="20" ry="16" fill="#FDFBF7"/>
    <ellipse cx="360" cy="330" rx="10" ry="8" fill="#E5A83B"/>

    <!-- Fresh Green Chili / Rosemary garnish -->
    <path d="M 410 330 Q 430 350 450 340" fill="none" stroke="#2D6A4F" stroke-width="6" stroke-linecap="round"/>
    <path d="M 330 260 Q 320 280 340 290" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round"/>

    <!-- Steam Swirls -->
    <path d="M 380 190 Q 370 160 390 140 T 380 110" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <path d="M 420 180 Q 440 150 420 130 T 430 100" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="250" y="500" width="300" height="48" rx="24" fill="#1F0803" opacity="0.85" stroke="#D99426" stroke-width="1.5"/>
  <text x="400" y="530" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="bold" fill="#F5EDE0" text-anchor="middle">Classic Doro Wat • የዶሮ ወጥ</text>
</svg>
