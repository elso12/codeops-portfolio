<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTibs" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3A1A12"/>
      <stop offset="100%" stop-color="#140805"/>
    </radialGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332E2C"/>
      <stop offset="100%" stop-color="#171514"/>
    </linearGradient>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F2D14"/>
      <stop offset="50%" stop-color="#5E1A0A"/>
      <stop offset="100%" stop-color="#3B0E04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgTibs)"/>
  
  <!-- Sizzling Cast Iron Skillet -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="300" r="210" fill="url(#panGrad)" stroke="#524845" stroke-width="8"/>
    <circle cx="400" cy="300" r="195" fill="#1C1918"/>

    <!-- Pan Handle -->
    <rect x="120" y="285" width="80" height="30" rx="6" fill="#332E2C" stroke="#524845" stroke-width="3"/>

    <!-- Seared Beef Chunks -->
    <rect x="320" y="230" width="45" height="38" rx="8" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(12 342 249)"/>
    <rect x="390" y="210" width="50" height="40" rx="10" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(-8 415 230)"/>
    <rect x="450" y="250" width="44" height="36" rx="8" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(25 472 268)"/>
    <rect x="300" y="290" width="52" height="42" rx="10" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(-15 326 311)"/>
    <rect x="370" y="280" width="48" height="45" rx="9" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(5 394 302)"/>
    <rect x="430" y="310" width="50" height="40" rx="8" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(-18 455 330)"/>
    <rect x="350" y="340" width="46" height="38" rx="8" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(18 373 359)"/>
    <rect x="410" y="360" width="48" height="36" rx="9" fill="url(#meatGrad)" stroke="#260902" stroke-width="2" transform="rotate(-6 434 378)"/>

    <!-- Green Jalapeño Rounds -->
    <circle cx="340" cy="270" r="14" fill="#2D6A4F" stroke="#1E4D2B" stroke-width="3"/>
    <circle cx="340" cy="270" r="6" fill="#1C1918"/>
    
    <circle cx="440" cy="230" r="16" fill="#2D6A4F" stroke="#1E4D2B" stroke-width="3"/>
    <circle cx="440" cy="230" r="7" fill="#1C1918"/>

    <circle cx="390" cy="340" r="15" fill="#2D6A4F" stroke="#1E4D2B" stroke-width="3"/>
    <circle cx="390" cy="340" r="6" fill="#1C1918"/>

    <!-- Rosemary Sprigs -->
    <path d="M 310 240 Q 350 220 380 250" fill="none" stroke="#40916C" stroke-width="4" stroke-linecap="round"/>
    <path d="M 420 350 Q 460 370 480 340" fill="none" stroke="#40916C" stroke-width="4" stroke-linecap="round"/>

    <!-- Awaze Butter Drizzle / Flames -->
    <path d="M 360 260 Q 400 300 440 270" fill="none" stroke="#D99426" stroke-width="3" opacity="0.8"/>

    <!-- Sizzling Steam -->
    <path d="M 360 180 Q 340 150 360 120" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M 410 170 Q 430 140 410 110" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M 450 190 Q 470 160 450 130" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="250" y="500" width="300" height="48" rx="24" fill="#140805" opacity="0.85" stroke="#D99426" stroke-width="1.5"/>
  <text x="400" y="530" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="bold" fill="#F5EDE0" text-anchor="middle">Siga Derek Tibs • ጥብሶች</text>
</svg>
