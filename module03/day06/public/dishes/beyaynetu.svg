<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBey" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1B3B24"/>
      <stop offset="100%" stop-color="#09170E"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgBey)"/>

  <!-- Platter Plate -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="300" r="220" fill="#2E2421" stroke="#D99426" stroke-width="6"/>
    <!-- Teff Injera base -->
    <circle cx="400" cy="300" r="204" fill="#EBE0D3"/>

    <!-- Rainbow Tasting Scoops -->
    <!-- 1. Misir Wat (Red Lentils - Center Top) -->
    <circle cx="400" cy="210" r="42" fill="#8F2D14"/>
    
    <!-- 2. Kik Alicha (Yellow Peas - Top Right) -->
    <circle cx="485" cy="240" r="38" fill="#E5A83B"/>

    <!-- 3. Gomen Collards (Green - Right) -->
    <circle cx="510" cy="320" r="40" fill="#2D6A4F"/>

    <!-- 4. Fosolia Carrots (Orange/Green - Bottom Right) -->
    <circle cx="460" cy="390" r="36" fill="#D99426"/>

    <!-- 5. Atakilt Wat (Cabbage/Potato - Bottom Left) -->
    <circle cx="340" cy="390" r="38" fill="#F4C46B"/>

    <!-- 6. Shiro Portion (Center Left) -->
    <circle cx="290" cy="320" r="40" fill="#A83216"/>

    <!-- 7. Timatim Fitfit (Fresh Tomato Salad - Top Left) -->
    <circle cx="315" cy="240" r="36" fill="#B83A1B"/>

    <!-- Center Rolled Injera Scroll -->
    <rect x="360" y="270" width="80" height="40" rx="20" fill="#D9C4B1" stroke="#A89480" stroke-width="3"/>
    <ellipse cx="360" cy="290" rx="10" ry="20" fill="#C5B19D"/>

    <!-- Steam Swirls -->
    <path d="M 380 160 Q 360 130 380 100" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M 420 150 Q 440 120 420 90" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="230" y="500" width="340" height="48" rx="24" fill="#09170E" opacity="0.85" stroke="#2D6A4F" stroke-width="1.5"/>
  <text x="400" y="530" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="bold" fill="#F5EDE0" text-anchor="middle">Full Vegan Beyaynetu • የጾም</text>
</svg>
