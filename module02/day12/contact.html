<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Habesha Eatery, Bole</title>
  <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa.">
</head>
<body>
  <header>
    <h1>Contact Habesha Eatery</h1>
  </header>

  <nav>
    <a href="index.html">Reservations</a> · 
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <!-- Contact Form -->
    <section aria-labelledby="contact-form-heading">
      <h2 id="contact-form-heading">Send Us a Message</h2>
      <form action="/contact" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

    <!-- Opening Hours Table -->
    <section aria-labelledby="hours-heading">
      <h2 id="hours-heading">Opening Hours</h2>
      <table>
        <caption>Habesha Eatery Opening Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Monday – Friday</td>
            <td>10:00 AM – 10:00 PM</td>
          </tr>
          <tr>
            <td>Saturday</td>
            <td>12:00 PM – 11:00 PM</td>
          </tr>
          <tr>
            <td>Sunday</td>
            <td>Closed</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>Bole, Addis Ababa</footer>
</body>
</html>
