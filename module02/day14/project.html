<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ethiopian Airlines Booking Layout</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <nav class="navbar">
        <div class="logo">Ethiopian Airlines</div>
        <div class="nav-links">
          <a href="#">Flights</a>
          <a href="#">Deals</a>
          <a href="#">Help</a>
          <button class="btn">Login</button>
        </div>
      </nav>
    </header>

    <aside class="sidebar">
      <h3>Filters</h3>
      <ul>
        <li>Price Range</li>
        <li>Stops</li>
        <li>Airports</li>
      </ul>
    </aside>

    <main class="main">
      <div class="toolbar">
        <button>Sort by Price</button>
        <button>Sort by Duration</button>
      </div>

      <div class="cards">
        <div class="card">
          <span class="badge">ETB Sale</span>
          <h4>Flight ET101</h4>
          <p>Addis Ababa → Nairobi</p>
        </div>
        <div class="card">
          <h4>Flight ET202</h4>
          <p>Addis Ababa → Dubai</p>
        </div>
        <div class="card">
          <h4>Flight ET303</h4>
          <p>Addis Ababa → London</p>
        </div>
        <div class="card">
          <h4>Flight ET404</h4>
          <p>Addis Ababa → Johannesburg</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      © 2026 Ethiopian Airlines — All Rights Reserved
    </footer>
  </div>
</body>
</html>
