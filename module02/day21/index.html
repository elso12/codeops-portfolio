<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 21: Persistent Signup Form</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        #error { color: red; font-weight: bold; margin-bottom: 15px; }
        #count { font-style: italic; color: gray; }
    </style>
</head>
<body>

    <h2>Signup Form</h2>
    <p id="count">People signed up: 0</p>
    
    <div id="error"></div>

    <form id="signup">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Almaz Dawit">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="0912345678">
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
